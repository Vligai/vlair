title: SSH Brute Force Attack
id: c9d0e1f2-a3b4-5678-cdef-901234567890
status: stable
description: Detects SSH brute force patterns in syslog/auth logs
references:
    - https://attack.mitre.org/techniques/T1110/001/
author: SigmaHQ community, adapted for vlair
date: 2024/01/01
tags:
    - attack.credential_access
    - attack.t1110.001
logsource:
    category: syslog
detection:
    selection:
        message|contains:
            - 'Failed password'
            - 'authentication failure'
            - 'Invalid user'
            - 'Failed publickey'
    condition: selection
level: medium
falsepositives:
    - Legitimate login failures from users who mistype passwords
