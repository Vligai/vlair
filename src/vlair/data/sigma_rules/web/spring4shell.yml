title: Spring4Shell Exploitation Attempt (CVE-2022-22965)
id: b8c9d0e1-f2a3-4567-bcde-890123456789
status: stable
description: Detects Spring Framework RCE exploitation via class.module.classLoader patterns
references:
    - https://nvd.nist.gov/vuln/detail/CVE-2022-22965
author: SigmaHQ community, adapted for vlair
date: 2024/01/01
tags:
    - attack.initial_access
    - attack.t1190
    - cve.2022.22965
logsource:
    category: webserver
detection:
    selection:
        path|contains:
            - 'class.module.classLoader'
            - 'class%2Emodule%2EclassLoader'
            - 'class[module][classLoader]'
    condition: selection
level: critical
falsepositives:
    - None expected in production environments
