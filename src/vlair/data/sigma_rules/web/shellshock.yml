title: Shellshock Exploitation Attempt
id: d4e5f6a7-b8c9-0123-defa-456789012345
status: stable
description: Detects Shellshock (CVE-2014-6271) exploitation via HTTP headers and paths
references:
    - https://nvd.nist.gov/vuln/detail/CVE-2014-6271
author: SigmaHQ community, adapted for vlair
date: 2024/01/01
tags:
    - attack.initial_access
    - attack.t1190
    - cve.2014.6271
logsource:
    category: webserver
detection:
    selection:
        user_agent|contains:
            - '() {'
            - '() { '
        path|contains:
            - '() {'
    condition: 1 of selection_*
level: critical
falsepositives:
    - None expected in production environments
