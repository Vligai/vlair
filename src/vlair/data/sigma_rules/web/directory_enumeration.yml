title: Web Directory Enumeration
id: a7b8c9d0-e1f2-3456-abcd-789012345678
status: stable
description: Detects rapid 404 responses indicative of directory/file enumeration
references:
    - https://attack.mitre.org/techniques/T1595/003/
author: SigmaHQ community, adapted for vlair
date: 2024/01/01
tags:
    - attack.reconnaissance
    - attack.t1595.003
logsource:
    category: webserver
detection:
    selection:
        status: 404
        path|contains:
            - '/admin'
            - '/backup'
            - '/config'
            - '/test'
            - '/phpmyadmin'
            - '/wp-admin'
            - '/jenkins'
            - '/.well-known'
            - '/api/swagger'
    condition: selection
level: low
falsepositives:
    - Legitimate 404 errors from misconfigured applications
