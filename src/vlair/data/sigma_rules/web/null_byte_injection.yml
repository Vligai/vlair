title: Null Byte Injection Attempt
id: e7f8a9b0-c1d2-3456-efab-789012345678
status: stable
description: Detects null byte injection attempts used to bypass file extension checks
references:
    - https://owasp.org/www-community/attacks/Null_Byte_Injection
author: SigmaHQ community, adapted for vlair
date: 2024/01/01
tags:
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: webserver
detection:
    selection:
        path|contains:
            - '%00'
            - '\x00'
            - '%2500'
    condition: selection
level: medium
falsepositives:
    - None expected in clean web traffic
