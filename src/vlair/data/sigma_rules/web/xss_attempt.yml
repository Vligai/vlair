title: Cross-Site Scripting (XSS) Attempt
id: b7d2c4e1-5f83-4a91-bc2d-8e7f9a3d1c05
status: stable
description: Detects XSS injection patterns in HTTP request paths
references:
    - https://owasp.org/www-community/attacks/xss/
author: SigmaHQ community, adapted for vlair
date: 2024/01/01
tags:
    - attack.initial_access
    - attack.t1190
logsource:
    category: webserver
detection:
    selection_script:
        path|contains:
            - '<script'
            - '</script>'
            - 'javascript:'
    selection_event_handlers:
        path|re: '(?i)(onerror|onload|onclick|onmouseover|onfocus)\s*='
    selection_encoded:
        path|contains:
            - '%3Cscript'
            - '%3C%2Fscript'
            - 'alert('
    condition: 1 of selection_*
level: medium
falsepositives:
    - Security scanners performing XSS testing
