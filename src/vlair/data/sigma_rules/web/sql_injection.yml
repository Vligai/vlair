title: SQL Injection Attempt in HTTP Request
id: a29c1813-ab24-4e38-83b0-f18a1c5c8d2b
status: stable
description: Detects SQL injection patterns in HTTP request paths and query strings
references:
    - https://owasp.org/www-community/attacks/SQL_Injection
author: SigmaHQ community, adapted for vlair
date: 2024/01/01
tags:
    - attack.initial_access
    - attack.t1190
logsource:
    category: webserver
detection:
    selection_union:
        path|contains|all:
            - 'union'
            - 'select'
    selection_or_injection:
        path|re: "(?i)(or\\s+1\\s*=\\s*1|and\\s+1\\s*=\\s*1|or\\s+'[^']*'\\s*=\\s*'[^']*')"
    selection_classic:
        path|contains:
            - "' OR '"
            - "'; DROP"
            - "1=1--"
            - "' --"
    condition: 1 of selection_*
level: high
falsepositives:
    - Legitimate SQL-like content in URLs (unlikely but possible in API paths)
