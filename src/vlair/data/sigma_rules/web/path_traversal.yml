title: Path Traversal Attempt
id: c3e5f7a9-1b2d-4e6f-8a0c-2d4f6e8a0c2e
status: stable
description: Detects directory traversal attempts in HTTP request paths
references:
    - https://owasp.org/www-community/attacks/Path_Traversal
author: SigmaHQ community, adapted for vlair
date: 2024/01/01
tags:
    - attack.discovery
    - attack.t1083
logsource:
    category: webserver
detection:
    selection_unix:
        path|contains:
            - '../'
            - '..%2F'
            - '..%5C'
            - '/etc/passwd'
            - '/etc/shadow'
            - '/proc/self'
    selection_windows:
        path|contains:
            - '..\\'
            - 'c:\\windows'
            - 'c:/windows'
            - 'boot.ini'
            - 'win.ini'
    condition: 1 of selection_*
level: high
falsepositives:
    - Legitimate URLs that happen to contain these patterns
