title: Open Redirect Attempt
id: b4c5d6e7-f8a9-0123-bcde-456789012345
status: stable
description: Detects open redirect attempts via URL parameters targeting external domains
references:
    - https://owasp.org/www-community/attacks/Unvalidated_Redirects_and_Forwards_Cheat_Sheet
author: SigmaHQ community, adapted for vlair
date: 2024/01/01
tags:
    - attack.initial_access
    - attack.t1566.002
logsource:
    category: webserver
detection:
    selection:
        path|re: '(?i)(url|redirect|next|target|dest|goto|return|link)=https?://'
    condition: selection
level: low
falsepositives:
    - Legitimate OAuth2 redirect_uri parameters
    - Return URL parameters in authentication flows
