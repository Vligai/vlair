title: Command Injection Attempt in HTTP Request
id: b2c3d4e5-f6a7-8901-bcde-f23456789012
status: stable
description: Detects OS command injection patterns in HTTP request paths
references:
    - https://owasp.org/www-community/attacks/Command_Injection
author: SigmaHQ community, adapted for vlair
date: 2024/01/01
tags:
    - attack.execution
    - attack.t1059
logsource:
    category: webserver
detection:
    selection_shell_ops:
        path|contains:
            - ';cat '
            - ';ls '
            - ';id;'
            - '|id|'
            - '`id`'
            - '$(id)'
            - ';whoami'
            - '|whoami'
    selection_encoded:
        path|contains:
            - '%3Bcat%20'
            - '%7Ccat%20'
            - '%60id%60'
            - '%24(id)'
    selection_cmd:
        path|re: '(?i)(;|\||\`|\$\()(wget|curl|bash|sh|cmd|powershell)\s'
    condition: 1 of selection_*
level: critical
falsepositives:
    - None expected in production HTTP logs
