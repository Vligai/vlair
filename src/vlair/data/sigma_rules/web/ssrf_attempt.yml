title: Server-Side Request Forgery (SSRF) Attempt
id: c3d4e5f6-a7b8-9012-cdef-345678901234
status: stable
description: Detects SSRF attempts targeting internal services via HTTP parameters
references:
    - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
    - https://attack.mitre.org/techniques/T1090/
author: SigmaHQ community, adapted for vlair
date: 2024/01/01
tags:
    - attack.discovery
    - attack.t1090
logsource:
    category: webserver
detection:
    selection_internal:
        path|contains:
            - '169.254.169.254'
            - 'metadata.google.internal'
            - 'metadata.internal'
            - '100.100.100.200'
    selection_localhost:
        path|re: '(?i)(url|redirect|next|target|dest|goto|link|src)=.*(localhost|127\.0\.0\.|0\.0\.0\.0|::1)'
    condition: 1 of selection_*
level: high
falsepositives:
    - Legitimate cloud metadata access from within cloud infrastructure
