title: XML Injection / XXE Attempt
id: c5d6e7f8-a9b0-1234-cdef-567890123456
status: stable
description: Detects XML External Entity (XXE) and XML injection patterns in HTTP requests
references:
    - https://owasp.org/www-community/vulnerabilities/XML_External_Entity_(XXE)_Processing
author: SigmaHQ community, adapted for vlair
date: 2024/01/01
tags:
    - attack.initial_access
    - attack.t1190
logsource:
    category: webserver
detection:
    selection:
        path|contains:
            - '<!DOCTYPE'
            - '<!ENTITY'
            - 'SYSTEM "file:'
            - 'SYSTEM "http:'
            - '%DTD'
    condition: selection
level: high
falsepositives:
    - None expected in production HTTP request logs
