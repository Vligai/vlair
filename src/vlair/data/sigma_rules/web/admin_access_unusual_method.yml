title: Unusual HTTP Method on Admin Endpoint
id: f6a7b8c9-d0e1-2345-fabc-678901234567
status: stable
description: Detects non-GET/POST methods (PUT, DELETE, TRACE, OPTIONS) on administrative paths
references:
    - https://attack.mitre.org/techniques/T1190/
author: SigmaHQ community, adapted for vlair
date: 2024/01/01
tags:
    - attack.initial_access
    - attack.t1190
logsource:
    category: webserver
detection:
    selection_method:
        method:
            - 'PUT'
            - 'DELETE'
            - 'TRACE'
            - 'CONNECT'
    selection_admin_path:
        path|contains:
            - '/admin'
            - '/manager'
            - '/console'
            - '/actuator'
            - '/api/v1/admin'
    condition: selection_method and selection_admin_path
level: medium
falsepositives:
    - REST APIs that legitimately use PUT/DELETE on admin resources
